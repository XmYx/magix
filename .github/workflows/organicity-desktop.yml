# Builds the Organicity desktop app for Linux (AppImage, deb, tar.gz), macOS (dmg, zip; x64 and
# arm64) and Windows (installer, portable), and runs the browser tests. Run it from the Actions
# tab, or push the exact tag desktop-v to publish
# a GitHub release that installed apps update themselves from.
#
# Signing is optional and driven by repository secrets; without them the builds are unsigned.
#   macOS:   MAC_CSC_LINK (base64 .p12), MAC_CSC_KEY_PASSWORD, and for notarisation
#            APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows: WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD
name: Organicity desktop

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v']

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install three.js (for the headless tests) and Playwright
        run: |
          npm install --prefix desktop --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Headless game tests
        run: node scripts/organicity-test.mjs
      - name: Browser tests
        run: |
          python3 -m http.server 8777 >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8777/organicity/ >/dev/null && break; sleep 1; done
          for t in browser features-browser acad-browser photo-browser; do
            echo "::group::$t"; node scripts/organicity-$t-test.mjs; echo "::endgroup::"
          done

  build:
    needs: browser-tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Package
        shell: bash
        run: |
          if [ -z "$CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; unset CSC_LINK CSC_KEY_PASSWORD; fi
          npm run dist
        env:
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK || matrix.os == 'windows-latest' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD || matrix.os == 'windows-latest' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Smoke test the Linux app (found a city, no errors)
        if: matrix.os == 'ubuntu-latest'
        run: ORGANICITY_SMOKE=1 ELECTRON_ENABLE_LOGGING=1 xvfb-run -a ./dist/linux-unpacked/organicity-desktop --no-sandbox
      - uses: actions/upload-artifact@v4
        with:
          name: organicity-${{ matrix.os }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.tar.gz
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml
          if-no-files-found: error

  # the desktop-v tag publishes the packages and the update manifests (latest*.yml) that
  # installed apps read from https://github.com/XmYx/magix/releases/latest/download
  release:
    if: github.ref == 'refs/tags/desktop-v'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Organicity ${{ github.ref_name }}
          files: packages/*
          make_latest: true
          generate_release_notes: true
